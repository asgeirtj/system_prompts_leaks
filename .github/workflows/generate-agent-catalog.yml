name: Generate agent catalog

on:
  push:
    branches: [main]
    paths:
      - 'Anthropic/**'
      - 'OpenAI/**'
      - 'Google/**'
      - 'Microsoft/**'
      - 'xAI/**'
      - 'Misc/**'
      - 'scripts/generate_agent_catalog.py'
      - '.github/workflows/generate-agent-catalog.yml'
  workflow_dispatch:

jobs:
  generate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate agent catalog
        run: python scripts/generate_agent_catalog.py --output AGENT_CATALOG.md

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENT_CATALOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update generated AI agent catalog"
            git push
          fi
