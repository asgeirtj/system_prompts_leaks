version: 1
metadata:
  visible_in_settings: true
auth:
  provider: evernote
  required: true
connector: evernote
category: productivity
display_name: Evernote
description: Capture, organize and search your notes
icon: evernote
request_quota:
  mode: shadow
  workers: [evernote]
  queries_per_minute: 50
  burst: 10
cli:
  binary: evernote
  skill: evernote
  service: evernote
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      content.read:
        label: Search and read Evernote content
        approval_phrase: search and read notes, notebooks, Spaces, tags and tasks in Evernote
      attachments.download:
        label: Download attachments
        approval_phrase: download an attachment from Evernote
        # Binary transfers stay inside the trusted worker; preserve this boundary.
        response_guard: disabled
  write:
    default: ask
    label: Write permissions
    methods:
      content.manage:
        label: Manage Evernote content
        approval_phrase: create or update notes, notebooks, Spaces, tags, tasks and attachments in Evernote
      content.delete:
        label: Trash notes and delete tasks
        approval_phrase: trash notes or delete tasks in Evernote
commands:
  status: null
  authorize-url: null
  exchange-code: null
  refresh: null
  disconnect: null
  list-tools: content.read
  # Each reviewed provider tool selects its own method at runtime.
  call-tool: null
consent_screen:
  bullets:
    - icon: data_types
      title: "Level up with Evernote"
      text: "Muse will access things like notes, notebooks, Spaces, tags, tasks and attachments."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Evernote. To learn more, view their [terms](https://evernote.com/legal/tos.php) and [privacy policy](https://evernote.com/privacy)."
