cli:
  binary: hatch_gws_cli
  skill: gmail
  service: gmail
declarable_scopes:
  - https://www.googleapis.com/auth/gmail.readonly
  - https://www.googleapis.com/auth/gmail.compose
  - https://www.googleapis.com/auth/gmail.modify
  - https://www.googleapis.com/auth/gmail.settings.basic
# Drafts are a DATA CLASS, not an API surface: a Gmail draft is an ordinary
# message carrying the system DRAFT label, so message and thread reads return
# full draft content even while the dedicated drafts methods are denied.
# Declaring the class makes Sentinel attach an exclusion constraint to every
# allowed messages read while "Access drafts" is deny/ask; the trusted
# hatch_gws_cli worker enforces it (query rewrite on list surfaces, DRAFT
# labelId filtering on reads) and fails closed on constraints it does not
# implement. Aliased raw methods (users.threads.*, users.history.list,
# users.messages.attachments.get) authorize as these two canonical keys, so
# listing the keys covers every aliased spelling.
data_classes:
  drafts:
    governed_by: users.drafts.list
    emitted_by:
      - users.messages.list
      - users.messages.get
actions:
  read:
    default: allow
    label: Read permissions
    response_guard: verification_codes
    methods:
      users.messages.list:
        label: Search emails
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.readonly
          - https://www.googleapis.com/auth/gmail.modify
      users.messages.get:
        label: Access emails
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.readonly
          - https://www.googleapis.com/auth/gmail.modify
      users.labels.list:
        label: Access labels and filters
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.readonly
          - https://www.googleapis.com/auth/gmail.modify
      users.drafts.list:
        label: Access drafts
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.readonly
          - https://www.googleapis.com/auth/gmail.modify
      users.settings.read:
        label: Access Gmail settings
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.settings.basic
          - https://www.googleapis.com/auth/gmail.readonly
          - https://www.googleapis.com/auth/gmail.modify
  write:
    default: ask
    label: Write and delete permissions
    methods:
      users.messages.send:
        label: Send emails
        approval_phrase: send this email in Gmail
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.send
          - https://www.googleapis.com/auth/gmail.compose
          - https://www.googleapis.com/auth/gmail.modify
      users.messages.unsubscribe:
        default: ask
        label: Unsubscribe from emails
        approval_phrase: unsubscribe from email lists
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.readonly
          - https://www.googleapis.com/auth/gmail.modify
      users.drafts.create:
        default: allow
        label: Draft emails
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.compose
          - https://www.googleapis.com/auth/gmail.modify
      users.mail.read_state:
        default: allow
        label: Mark as read or unread
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.modify
      users.messages.trash:
        default: allow
        label: Move emails to trash
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.modify
      users.labels.manage:
        default: allow
        label: Manage labels
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.modify
      users.filters.manage:
        # Temporarily withheld from Settings and rejected by the CLI pending scope approval.
        # Keep the key and saved permissions for re-enablement.
        label: Manage filters
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.settings.basic
      users.messages.import:
        default: allow
        label: Import emails
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.insert
          - https://www.googleapis.com/auth/gmail.modify
      users.settings.manage:
        label: Manage Gmail settings
        approval_phrase: manage settings in Gmail
        requires_scopes:
          - https://www.googleapis.com/auth/gmail.settings.basic
