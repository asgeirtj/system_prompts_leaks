description: Get tailored insights from your health records
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      tools.list:
        label: List available HealthEx tools
        approval_phrase: list available HealthEx tools
      records.read:
        label: Access patient health records
commands:
  status: null
  setup: null
  disconnect: null
  authorize-url: null
  refresh: null
