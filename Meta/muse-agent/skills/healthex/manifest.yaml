consent_screen:
  bullets:
    - icon: data_types
      title: "Level up with HealthEx"
      text: "Muse will access things like information from visits, health conditions, medications and anything else that you choose to share."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "Learn more about how we use this info in our [Privacy Policy](https://www.facebook.com/privacy/policy/) and [Health Policy](https://www.facebook.com/privacy/policies/health/)."
    - "Muse will exchange info with HealthEx. To learn more, view their [terms](https://www.healthex.io/terms-of-service) and [privacy policy](https://www.healthex.io/privacy-policy)."
    - text: "[Meta-only] By tapping Connect, you agree to the [Research Consent Agreement](https://drive.google.com/file/d/13KBY7K-WDf1PD5NsDnjzMxMByUOigjtt/view). Your data may be accessed by the Muse team for debugging and troubleshooting purposes."
      audience: employee
