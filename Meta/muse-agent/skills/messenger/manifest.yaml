version: 1
metadata:
  visible_in_settings: true
auth:
  provider: messenger_companion
  required: true
cli:
  binary: hatch_messenger_cli
  skill: messenger_read
connector: messenger_read
category: social
display_name: Messenger
description: Remember past conversations, keep track of plans and stay on top of the chats that matter most
icon: messenger
request_quota:
  mode: enforce
  workers:
    - messenger
# Valid CLI subcommand paths, consumed by jarvis runtime-event logging to enrich
# tool-variant telemetry (e.g. `messenger-cli/messages/send`). Validated by the
# subcommand_paths_match_manifest test in hatch-messenger-cli.
cli_subcommands:
  - "admins add"
  - "admins remove"
  - "call-logs"
  - "check"
  - "contacts"
  - "edit"
  - "connect-url"
  - "disconnect"
  - "disconnect-url"
  - "logout"
  - "marketplace initiate"
  - "messages"
  - "participants add"
  - "participants remove"
  - "poll create"
  - "poll vote"
  - "react"
  - "repair"
  - "search"
  - "send"
  - "sync both"
  - "sync contacts"
  - "sync messages"
  - "sync threads"
  - "thread-create"
  - "threads"
  - "unlock"
  - "unsend"
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      calls.read:
        label: Access call history
        approval_phrase: access call history in Messenger
      messages.read:
        label: Access messages
        approval_phrase: access messages in Messenger
      contacts.read:
        label: Access contacts
        approval_phrase: access contacts in Messenger
  write:
    default: ask
    label: Write and delete permissions
    methods:
      messages.compose:
        approval_policy: fresh_consent_only
        label: Send messages
        approval_phrase: send this message in Messenger
        approval_button_variants:
          send:
            allow_once: Send
            deny: "Don't send"
            deny.task: "Don't send"
      messages.edit:
        approval_policy: fresh_consent_only
        label: Edit or remove messages
        approval_phrase: edit or remove this message in Messenger
      participants.manage:
        approval_policy: fresh_consent_only
        label: Add or remove group members
        approval_phrase: add or remove people in this group chat
      thread_admins.manage:
        approval_policy: fresh_consent_only
        label: Add or remove group admins
        approval_phrase: add or remove admins in this group chat
commands:
  # Connection lifecycle and local key-state plumbing; not policy-gated.
  check: null
  logout: null
  connect-url: null
  disconnect-url: null
  disconnect: null
  repair: null
  call-logs: calls.read
  contacts: contacts.read
  "sync contacts": contacts.read
  threads: messages.read
  messages: messages.read
  search: messages.read
  "sync threads": messages.read
  "sync messages": messages.read
  "sync both": messages.read
  send: messages.compose
  "marketplace initiate": messages.compose
  # Reactions share the send-message permission.
  react: messages.compose
  unsend: messages.edit
  edit: messages.edit

consent_screen:
  bullets:
    - icon: data_types
      title: "Level up with Messenger"
      text: "Muse will access things like messages and media."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  callout_title: "Non-confidential connector"
  footer_paragraphs:
    - text: "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
      variants:
        confidential_vm:
          text: "Messenger is from Meta, so some of the info exchanged will be visible to Meta. Your end-to-end encrypted chats stay private, and Meta can't read them. [Learn more](https://muse.ai/privacy)"
          placement: callout
    - "Muse will exchange info with Messenger. To learn more, view Meta's [terms](https://www.facebook.com/terms/) and [privacy policy](https://www.facebook.com/privacy/policy/)."
