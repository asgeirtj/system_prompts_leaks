version: 1
metadata:
  visible_in_settings: true
auth:
  provider: notion
  required: true
connector: notion
category: productivity
display_name: Notion
description: Collaborate and stay organized
icon: notion
cli:
  binary: notion-cli
  skill: notion
request_quota:
  mode: enforce
  workers:
    - notion-cli
  queries_per_minute: 180
  burst: 50
# The AI-search and database/meeting-notes query tools are keyed to
# search.read but return page and database CONTENT "Access content"
# (pages.read) governs, so search.read is a page-content DATA CLASS emitter.
# While pages.read is deny/ask, Sentinel attaches an exclusion constraint and
# the trusted worker refuses those content-bearing tools; plain search returns
# titles and links and proceeds.
data_classes:
  page_content:
    governed_by: pages.read
    emitted_by:
      - search.read
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      pages.read:
        label: Access content
        approval_phrase: read your Notion pages and files
      search.read:
        label: Search content
        approval_phrase: search your Notion workspace
      workspace.read:
        label: Access workspace info
        approval_phrase: read workspace info like teams, members and comments
  write:
    default: ask
    label: Write and delete permissions
    methods:
      pages.write:
        label: Create and edit content
        approval_phrase: create, edit, move or duplicate pages and folders in Notion
        approval_button_variants:
          create:
            allow_once: "Create"
            deny: "Don't create"
            deny.task: "Don't create"
          edit:
            allow_once: "Edit"
            deny: "Don't edit"
            deny.task: "Don't edit"
          move:
            allow_once: "Move"
            deny: "Don't move"
            deny.task: "Don't move"
          duplicate:
            allow_once: "Duplicate"
            deny: "Don't duplicate"
            deny.task: "Don't duplicate"
      comments.write:
        label: Add comments
        approval_phrase: post a comment in Notion
        approval_buttons:
          allow_once: "Comment"
          deny: "Don't comment"
          deny.task: "Don't comment"
      databases.write:
        label: Create and edit databases
        approval_phrase: create or change a database in Notion
        approval_button_variants:
          create:
            allow_once: "Create"
            deny: "Don't create"
            deny.task: "Don't create"
          edit:
            allow_once: "Edit"
            deny: "Don't edit"
            deny.task: "Don't edit"
      views.write:
        label: Change database views
        approval_phrase: create or change a database view in Notion
        approval_button_variants:
          create:
            allow_once: "Create"
            deny: "Don't create"
            deny.task: "Don't create"
          edit:
            allow_once: "Edit"
            deny: "Don't edit"
            deny.task: "Don't edit"
      attachments.write:
        label: Upload files
        approval_phrase: upload a file to Notion
        approval_buttons:
          allow_once: "Upload"
          deny: "Don't upload"
          deny.task: "Don't upload"
      skills.write:
        label: Publish skills
        approval_phrase: publish a skill to your Notion workspace
        approval_buttons:
          allow_once: "Publish"
          deny: "Don't publish"
          deny.task: "Don't publish"
      agents.write:
        label: Run custom agents
        approval_phrase: start or stop a Notion Custom Agent session, or send a message to one
        approval_button_variants:
          start:
            allow_once: "Start"
            deny: "Don't start"
            deny.task: "Don't start"
          stop:
            allow_once: "Stop"
            deny: "Don't stop"
            deny.task: "Don't stop"
          send:
            allow_once: "Send"
            deny: "Don't send"
            deny.task: "Don't send"
commands:
  status: null
  authorize-url: null
  exchange-code: null
  refresh: null
  disconnect: null
  # Lists the remote MCP catalogue without a connector authorization check.
  list-tools: null
  # The CLI picks the method from --name via its tool-to-method table.
  call-tool: null

consent_screen:
  bullets:
    - icon: data_types
      title: "Level up with Notion"
      text: "Muse will access things like pages, databases, comments and files."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Notion. To learn more, view their [terms](https://www.notion.so/Terms-and-Privacy-28ffdd083dc3473e9c2da6ec011b58ac) and [privacy policy](https://www.notion.so/Privacy-Policy-3468d120cf614d4c9014c09f6adc9091)."
