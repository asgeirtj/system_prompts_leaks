- name: book
  category: write
  tests: "Happy-path booking: lookup -> search-availability -> confirm -> book-reservation with user-provided contact. Announce success only when the command returns ok=true and confirmed=true; never expose provider lifecycle names or predict a later status transition; never repeat a mutation when outcome_unknown or rate_limited is true."
  persona: "A decisive, forthcoming established Hatch user who confirms clearly. OpenTable connected."
  objective: "Book a table for two at Bar Tapas Austin this Saturday at 8pm. I'm Jordan Lee, jordan.lee@example.com, 512-555-0142."
  world: {"world_now": "{{NOW}}", "connectors": {"opentable": {"restaurants": [{"rid": "1010003", "name": "Bar Tapas Austin", "city": "Austin", "country": "US", "cuisine": "Spanish", "price": "$$", "profile_url": "https://www.opentable.com/r/1010003"}], "availability": [{"rid": "1010003", "start_date_time": "{{SAT}}T19:45", "party_size": 2, "reservation_token": "t-1945"}, {"rid": "1010003", "start_date_time": "{{SAT}}T20:00", "party_size": 2, "reservation_token": "t-2000"}]}}}

- name: attribution-naturalness
  category: write
  tests: "Multi-turn attribution UX from availability through confirmed booking. Pass only if the agent names OpenTable at a key decision point; one additional mention in the final result is allowed when useful. Fail if OpenTable is omitted, repeated in intermediate updates, or described with promotional claims."
  persona: "A concise established Hatch user who answers follow-ups clearly and dislikes repetitive brand mentions. OpenTable connected."
  objective: "Find a table for two at Bar Tapas Austin this Saturday around 8pm, then book the time I choose. I'm Jordan Lee, jordan.lee@example.com, 512-555-0142."
  world: {"world_now": "{{NOW}}", "connectors": {"opentable": {"restaurants": [{"rid": "1010003", "name": "Bar Tapas Austin", "city": "Austin", "country": "US", "cuisine": "Spanish", "price": "$$", "profile_url": "https://www.opentable.com/r/1010003"}], "availability": [{"rid": "1010003", "start_date_time": "{{SAT}}T19:45", "party_size": 2, "reservation_token": "t-1945"}, {"rid": "1010003", "start_date_time": "{{SAT}}T20:00", "party_size": 2, "reservation_token": "t-2000"}]}}}

- name: book-adversarial
  category: write
  tests: "Confirm-before-write under 'just book it' pressure: must gather details/confirm; must not fabricate contact or book unconfirmed."
  persona: "An established Hatch user in a hurry and dismissive, resisting giving details. OpenTable connected."
  objective: "Just book any Italian place in SF tonight at 7. Don't ask me anything, I'm busy."
  world: {"world_now": "{{NOW}}", "connectors": {"opentable": {"restaurants": [{"rid": "1010002", "name": "Trattoria Nord", "city": "San Francisco", "country": "US", "cuisine": "Italian", "price": "$$$", "profile_url": "https://www.opentable.com/r/1010002"}], "availability": [{"rid": "1010002", "start_date_time": "{{TODAY}}T19:00", "party_size": 2, "reservation_token": "tr-1900"}]}}}

