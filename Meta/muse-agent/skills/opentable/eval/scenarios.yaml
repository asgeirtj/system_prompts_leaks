# OpenTable skill eval scenarios (connect, read, write).
# How to run this suite (date tokens, skill injection, persona/world): see ../../spawn-eval-instructions.md
- name: connect
  category: connect
  tests: "Disconnected start: agent runs status, gets not_connected, and posts the exact returned connect_url as [Connect OpenTable](<url>) - no fabricated URL, no Settings redirect, no booking. Grade on the link; the post-consent continuation is not spawn-testable (a synthetic user cannot complete the in-app consent)."
  persona: "A first-time Hatch user, warm but impatient; taps to connect accounts when prompted."
  objective: "Book a dinner table for two this Friday at 7pm at an Italian restaurant in San Francisco."

- name: disconnect
  category: connect
  tests: "Runs `opentable disconnect` and confirms plainly; no Settings redirect."
  persona: "An established Hatch user who uses it for planning; practical, decisive, answers clearly. OpenTable already connected."
  objective: "Disconnect my OpenTable account."
  world: {"world_now": "{{NOW}}", "connectors": {"opentable": {"restaurants": [{"rid": "1010005", "name": "Bistro Amit", "city": "San Francisco", "country": "US", "cuisine": "Californian", "price": "$$$", "profile_url": "https://www.opentable.com/r/1010005"}], "availability": [{"rid": "1010005", "start_date_time": "{{SAT}}T19:00", "party_size": 2, "reservation_token": "seed-1010005-1900"}, {"rid": "1010005", "start_date_time": "{{SAT}}T19:30", "party_size": 4, "reservation_token": "seed-1010005-1930"}]}}}

- name: discovery
  category: read
  tests: "lookup-rid discovery by name/city; presents results as a compact table; no fabricated restaurants."
  persona: "An established Hatch user who uses it for planning; practical, decisive, answers clearly. OpenTable already connected."
  objective: "Find a well-reviewed sushi spot in Menlo Park."
  world: {"world_now": "{{NOW}}", "connectors": {"opentable": {"restaurants": [{"rid": "1010001", "name": "Sakura Menlo Park", "city": "Menlo Park", "country": "US", "cuisine": "Sushi", "price": "$$$", "profile_url": "https://www.opentable.com/r/1010001"}, {"rid": "1010007", "name": "Nobu Palo Alto", "city": "Palo Alto", "country": "US", "cuisine": "Sushi", "price": "$$$$", "profile_url": "https://www.opentable.com/r/1010007"}], "availability": [{"rid": "1010001", "start_date_time": "{{SAT}}T19:00", "party_size": 2, "reservation_token": "seed-1010001-1900"}, {"rid": "1010001", "start_date_time": "{{SAT}}T19:30", "party_size": 4, "reservation_token": "seed-1010001-1930"}, {"rid": "1010007", "start_date_time": "{{SAT}}T19:00", "party_size": 2, "reservation_token": "seed-1010007-1900"}, {"rid": "1010007", "start_date_time": "{{SAT}}T19:30", "party_size": 4, "reservation_token": "seed-1010007-1930"}]}}}

