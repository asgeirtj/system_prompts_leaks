version: 1
metadata:
  visible_in_settings: true
auth:
  client_id: "7a853e15-5265-4b4d-8950-28bf94865c92"
  provider: microsoft_contacts
  required: true
  authorization_query:
    prompt: select_account
  identity:
    endpoint: https://graph.microsoft.com/v1.0/me?$select=id,displayName,mail,userPrincipalName
    provider_account_id_field: id
    display_name_fields:
      - mail
      - userPrincipalName
      - displayName
cli:
  binary: outlook-contacts
  skill: outlook_contacts
connector: outlook_contacts
category: productivity
display_name: Outlook Contacts
description: Search and manage your contacts and address book
icon: outlook_contacts
multi_account:
  backend: oauth
  credential_namespace: oauth_accounts
  domains:
    - graph.microsoft.com
  expose_routing_metadata: true
request_quota:
  mode: enforce
  workers:
    - outlook-contacts
  queries_per_minute: 600
  burst: 50
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      contacts.list:
        label: Access contacts
        approval_phrase: access contacts in Outlook Contacts
  write:
    default: allow
    label: Write and delete permissions
    methods:
      contacts.create:
        label: Create contacts
      contacts.update:
        label: Edit contacts
      contacts.delete:
        label: Delete contacts
commands:
  status: null
  accounts: null
  disconnect: null
  authorize-url: null
  exchange-code: null
  list: contacts.list
  get: contacts.list
  search: contacts.list
  create: contacts.create
  update: contacts.update
  delete: contacts.delete

consent_screen:
  bullets:
    - icon: data_types
      title: "Level up with Outlook Contacts"
      text: "Muse will access things like names and contact info."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Outlook Contacts. To learn more, view their [terms](https://www.microsoft.com/servicesagreement) and [privacy policy](https://privacy.microsoft.com/privacystatement)."
