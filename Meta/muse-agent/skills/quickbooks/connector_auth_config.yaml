name: quickbooks
schema: oauth
mode: direct_oauth
hosts:
  - appcenter.intuit.com
  - mcp.quickbooks.intuit.com
  - oauth.platform.intuit.com
token_proxy:
  - field: credentials.access_token
    placement: bearer_header
stripped:
  - credentials.refresh_token
token_refresh:
  - path: /oauth2/v1/tokens/bearer
