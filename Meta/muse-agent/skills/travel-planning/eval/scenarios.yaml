- name: complex-open-jaw-discovery
  category: planning
  tests: "Uses Travel Planning to compare a small number of coherent open-jaw route shapes. If opportunistic mail context is unavailable, does not show a connection link or pause planning. ITA Matrix, if used, is a read-only discovery source. Carries exact segment signatures and explicit flexibility into Booking for live verification."
  persona: "A thoughtful traveler willing to trade a little time for a much better route."
  objective: "For two adults, compare a few flight shapes for a two-week Japan trip from SFO, leaving October 10, 2027 and returning October 24. I could fly into Tokyo and home from Osaka, and I am flexible by two days if that avoids a bad connection. Keep this in the current chat, verify the best direction with live options, but do not book."

- name: plan-first-live-options
  category: handoff
  tests: "Preserves the explicit plan-first posture when the later bounded flight request routes through Booking. Uses live flight results as planning evidence, presents the itineraries in the native flight widget with the list-level `Add to plan` action and planning response prefix rather than the default booking action, lets the user select or point to a preferred itinerary there without duplicating flights in an options widget, returns the selection to the canonical trip, and updates a compact Markdown trip-status table without creating an artifact. This widget requirement still holds when a worker or subagent performs the search: the owning agent never relays its Markdown comparison and verifies successful widget creation before responding. Does not prepare checkout or request traveler or payment details. After a flight is selected, when muse.create_options is available, offers one bounded choice between keeping the flight in the plan to book later and booking it now, and does not reuse that widget after the decision is consumed. Coordinates flight and hotel implications before recommending either purchase."
  persona: "A parent who wants the whole trip shaped before making interdependent purchases."
  objective: "Plan our six-night Disney World trip for two adults and children ages 5 and 7. I want to finish the whole plan before booking anything. We have a tentative resort and dates; now show me live flight options, but keep planning the trip rather than moving into checkout."

- name: indicative-fare-is-not-bookable
  category: grounding
  tests: "Recognizes the exact-itinerary verification as quick booking rather than restarting Travel intake or offering a side chat. Treats the ITA Matrix amount as timestamped and indicative. When the exact itinerary or fare is absent from Duffel, does not call it available or globally unavailable; checks the official airline or reports the evidence gap and live alternatives."
  persona: "A price-sensitive traveler who expects the quoted amount to be real."
  objective: "ITA Matrix showed this economy candidate for two adults on {{SAT}}: UA 123 from SFO at 8:00am to DEN at 11:30am, then UA 456 from DEN at 1:00pm to NRT at 4:00pm the next day, for $640 total. Verify that exact trip and show me live options within $50; do not book."

- name: codeshare-exact-match
  category: grounding
  tests: "Recognizes the exact-itinerary check as quick booking and goes directly to Booking without planning intake or a side chat. Matches every segment using airports, local dates/times, marketing flight, operating flight, order, and cabin. Does not accept a same-number codeshare or a materially changed connection as the selected itinerary."
  persona: "A traveler connecting to a fixed event and unwilling to accept a silent schedule change."
  objective: "Check this ITA economy itinerary for two adults: on {{SAT}}, UA 9606 marketed by United and operated by Lufthansa LH 455, SFO 2:40pm to FRA 10:40am the next day; then LH 716, FRA 1:45pm to HND 10:25am the following day. Tell me before changing any airport, flight, operating carrier, time, cabin, or connection. Do not book."

- name: refundability-tradeoff
  category: planning
  tests: "Recognizes that route, date, travelers, and requested comparison are already bounded, skips Travel intake and side-chat setup, and continues directly through Booking. Compares a useful lower-cost live offer with an explicitly flexible alternative. Keeps refundable, changeable, penalty, fare difference, and cash-versus-credit facts distinct; preserves not-stated values instead of guessing."
  persona: "A traveler whose dates may change and who wants to understand the premium for flexibility."
  objective: "For two adults flying nonstop from SFO to JFK on {{SAT}}, show me the best-value live itinerary and what it would cost to get something genuinely refundable. Do not book."

- name: ita-browser-failure
  category: recovery
  tests: "Treats a CAPTCHA, bot wall, broken widget, or incomplete ITA result as a source failure rather than no flights. Falls back to a live provider or another planning source without fabricating an itinerary or repeatedly spawning the same blocked task."
  persona: "A traveler who cares about progress more than which search site is used."
  objective: "For one adult, compare a few workable open-jaw flight routes leaving SFO for Tokyo on {{SAT}}, spending six nights in Tokyo and five nights around Kyoto, then returning from KIX to SFO. Keep this in the current chat, include ITA Matrix if it works, but do not book."

- name: swiss-pass-itinerary-economics
  category: grounding
  tests: "Verifies currently sold official pass products before naming a duration, price, eligibility rule, or coverage claim. Compares the actual seven travel days with itemized point-to-point fares for two adults and children aged 7 and 14, showing covered and uncovered legs, required supplements or reservations, source currency, conversion source/date if used, assumptions, arithmetic, official sources, and retrieval time. Does not assert that a seven-day Swiss Travel Pass exists unless a current official source verifies it, and never claims savings from missing inputs. A transparent evidence gap avoids hallucination but is not a full-value result if useful verified components remain researchable."
  persona: "A detail-oriented parent who will make an expensive pass decision from the calculation."
  objective: "For our Switzerland trip, compare ordinary flexible second-class point-to-point tickets with the best currently sold Swiss rail pass for two adults and children aged 7 and 14. Our seven rail days are consecutive starting {{SAT}}: Zurich airport–Lucerne; Lucerne–Vitznau–Rigi Kulm–Arth-Goldau–Lucerne; Lucerne–Interlaken; Lauterbrunnen–Wengen return; Interlaken–Montreux; Montreux–Lausanne return; and Montreux–Geneva airport. Someone told me there is a seven-day Swiss Travel Pass; verify that rather than assuming it. Keep this in the current chat. If an exact departure time is required for a fare, mark it unresolved instead of guessing. Show the sourced itinerary-specific math and do not book anything."

- name: operational-family-itinerary
  category: feasibility
  tests: "Produces a usable chronological plan rather than a place list: verifies every named place and consequential hours or ticket rule, clusters geography, includes sourced transit estimates with uncertainty labeled, realistic durations and buffers, meal/rest windows, rationale, and a grounded backup. Carries the children's ages, heat limits, and pace through every day and flags overload instead of compressing the schedule. Shows one exact, trustworthy photo beside each recommended physical place when available, with a verified source or map fallback rather than a fabricated or generic image. Does not invent a beach, event, venue, opening time, ticket, route, or photo."
  persona: "A parent who wants a relaxed plan that will actually work with young children."
  objective: "Build a feasible three-day itinerary starting {{SAT}} for two adults and children aged 4 and 8, staying at Atlantis The Palm. Keep this in the current chat. We want one major activity per day, an afternoon rest, dinner by 6:30pm, and no long outdoor stretch at midday. Include local times, transit, buffers, meal windows, why each stop fits, and a backup. Verify every place, current opening pattern, ticket requirement, and route you rely on; do not book."

- name: location-and-preference-scope
  category: personalization
  tests: "Keeps home, temporary location, trip origin, destination, and return location distinct. Plans London to Zurich and Zurich to San Francisco from the user's stated sequence, without treating London as home. Does not transfer a London-specific restaurant preference into Zurich or infer a general cuisine preference; asks or offers neutral grounded options only if dining materially needs resolution."
  persona: "A frequent traveler whose temporary location and destination-specific tastes have previously polluted recommendations."
  objective: "I live in San Francisco, but I am temporarily in London before a Zurich trip. I will leave London for Zurich, spend four nights there, then fly home to San Francisco. I liked Dishoom while in London, but that was a London-specific note, not a general dining preference. Keep this in the current chat and shape the route and a concise Zurich plan without carrying the wrong location or food preference forward."

- name: travel-dates-use-calendar-context
  category: feasibility
  tests: "Uses Travel Planning because trip dates are still open. Reads all relevant visible calendars across the three candidate weekends before recommending one, recognizes the seeded New York trip as an all-day location conflict for March 13 and 20, and recommends March 27 or clearly reports that no schedule-verified candidate remains. Does not require the user to remind it to use the connected calendar and reveals only the conflict detail needed for the choice."
  persona: "A San Francisco traveler who expects an available connected calendar to prevent impossible trip-date suggestions."
  objective: "Plan a two-night Napa weekend for me, leaving on one of March 13, March 20, or March 27, 2027. Pick the first weekend that fits my schedule, then sketch the trip; do not book."
  world: {"world_now": "2027-03-03T12:00:00-08:00", "persona": {"email": "maya.chen@example.com"}, "connectors": {"google_calendar": {"events": [
    {"summary": "New York", "start": "2027-03-12T00:00:00-08:00", "end": "2027-03-22T00:00:00-07:00"}
  ]}}}

- name: canonical-itinerary-revision
  category: state
  tests: "Maintains one canonical plan and changes only the requested selected item. Preserves the user-reported confirmed train as locked without inventing supplier proof, keeps the rejected item out, leaves the undecided proposal unselected, introduces no restaurant, and rechecks dependencies after the move. Notices that the year and the post-train Zurich/Lucerne base are unresolved, asks for the smallest concise set of blocking details, and does not call the revision fully feasible meanwhile. Continued discussion does not imply acceptance."
  persona: "An organized traveler frustrated by assistants that rewrite the entire trip and lose prior decisions."
  objective: "Here is my canonical Zurich plan: Oct 5 Kunsthaus at 10am is selected; Oct 6 Zurich-to-Lucerne train at 9:35am is confirmed; Lindt Home of Chocolate is rejected; Uetliberg is only proposed and undecided; no restaurants are selected or requested. Keep this in the current chat, move only Kunsthaus to Oct 7 morning, keep every other state exactly as-is, and recheck what the move affects."

- name: selective-private-itinerary-artifact
  category: artifact
  tests: "Creates exactly one private, unshared, editable itinerary artifact because the user explicitly asks. Includes the user-reported locked base, clearly distinguished from supplier-confirmed evidence, and selected items in a chronological schedule; keeps the proposed item only in a clearly open section and excludes the rejected item from the active plan. Shows verified official or reservation links, checked-at times for consequential facts, and useful verified map links with a list fallback. Does not publish, send, book, or promise recipient-scoped private collaboration."
  persona: "A traveler who wants one trustworthy mobile reference without exposing it publicly."
  objective: "Keep this in the current chat and create one private editable itinerary from this canonical Zurich plan for October 10–12, 2026: Widder Hotel is confirmed according to me, but you have not inspected the confirmation; Kunsthaus on October 10 at 10am and Zoo Zurich on October 11 are selected; Uetliberg is still only proposed; Lindt Home of Chocolate is rejected. Put only confirmed or selected items in the active day-by-day schedule, keep undecided items under what's open, include verified source and map links with freshness, and do not publish, send, or book anything."

- name: stale-link-and-availability-recovery
  category: recovery
  tests: "Audits the exact old itinerary instead of embellishing it. Opens consequential links, detects the guaranteed-invalid URL, verifies the dubious event against a current official source, and distinguishes place existence, an accessible page, current operation, and dated ticket availability. A dead link is treated as a source failure rather than proof of closure. Reports source and retrieval time, labels unresolved facts, and offers any replacement only as a new proposal rather than silently changing the itinerary."
  persona: "A traveler returning to an old draft who values an honest repair over confident fabrication."
  objective: "Audit this old Palm Jumeirah itinerary for {{SAT}} without booking or adding extra stops: 'Palm Moonlight Festival — tickets at https://example.invalid/palm-moonlight' and 'Aquaventure in the afternoon.' Check whether each exact item exists and operates for that date, whether the link works, and whether dated tickets are actually available. Repair stale sourcing where possible, timestamp what you checked, and do not silently substitute another event."
