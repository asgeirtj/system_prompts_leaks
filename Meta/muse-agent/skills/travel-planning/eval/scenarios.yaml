# Travel-planning routing, itinerary, grounding, and booking-handoff scenarios.
# How to run this suite: see ../../spawn-eval-instructions.md.
# Each objective must be self-contained because every scenario starts fresh.
# Run mutation cases with seeded/test providers or stop at native final approval.

- name: bounded-live-flight-search
  category: routing
  tests: "Recognizes this as quick booking and routes directly to Booking and the live flight provider. Does not start Travel intake, mine historical preferences, offer a side chat, gather inspirational images, or force an ITA Matrix planning pass. Uses the actual passenger mix and does not claim a fare before a provider returns one."
  persona: "A traveler who knows the route and date and wants a concise answer."
  objective: "Find me a nonstop flight from SFO to JFK next Friday for two adults, and show me what I can actually book."

- name: bounded-nonflight-reservation
  category: routing
  tests: "Recognizes this as quick booking and routes directly to Booking and the relevant live provider. Does not start Travel intake, mine historical preferences, offer a side chat, add destination ideas, or expand it into a trip itinerary."
  persona: "A diner who has already chosen the place, date, time, and party."
  objective: "Find a table at Copra in San Francisco this {{SAT}} at 6:30pm for two people and show me live availability; do not book yet."

- name: bounded-hotel-booking
  category: routing
  tests: "Recognizes the named stay, dates, occupancy, room, refund requirement, and price bound as enough for quick booking. Goes directly to Booking's current hotel website or provider path, without Travel intake, preference mining, a side-chat offer, or unrelated hotel inspiration. Continues toward the normal final-review boundary and reports any missing live term instead of inventing it."
  persona: "A decisive traveler who has already chosen the property and booking bounds."
  objective: "Book one refundable king room at the Park Hyatt Tokyo for one adult, October 10–12, 2027, up to $900 per night before taxes. Go straight to the booking; don't help me plan the rest of the trip."

- name: bounded-show-booking
  category: routing
  tests: "Recognizes this as quick booking and goes directly to Booking plus the event specialist. Does not open a Travel brief, suggest a side chat, research destination preferences, or add nearby activities. Preserves the exact event, performance, party, seat bounds, and total cap through live verification and approval."
  persona: "A theatergoer who has already made the meaningful choices and wants execution."
  objective: "Get two adjacent orchestra tickets for the 7pm Hamilton performance at the Orpheum Theatre in San Francisco this {{SAT}}, up to $300 total. Go straight to the booking and tell me only if that exact performance or bound cannot be met."

- name: standalone-travel-fact
  category: routing
  tests: "Answers the factual question directly without creating itinerary state, checking live inventory, or pushing the user into Travel Planning or Booking."
  persona: "A curious user who is not planning or booking a trip."
  objective: "What side of the road do people drive on in Japan?"

- name: adjacent-domestic-international-legs
  category: grounding
  tests: "Treats the request as an operational decision within an active trip. Normalizes `HAN → DAD` and `DAD → DMK` as separate legs. Classifies `HAN → DAD` as domestic within Vietnam. Classifies `DAD → DMK` as international from Vietnam to Thailand unless an authoritative source proves a route-specific exception. Verifies the arrival process at DMK and every consequential fast-track claim with the authority that owns each fact. Compares only arrival-transfer options that serve DMK under the stated arrival constraints. Does not inherit a domestic-terminal label from `HAN → DAD`, invent an exception, state an unsourced queue time as current fact, start a broad planning intake, or book anything."
  persona: "A user comparing airport logistics within an existing Southeast Asia trip."
  objective: "My HAN to DAD flight arrives at Da Nang's domestic terminal. Three days later, I fly AirAsia from DAD to Bangkok DMK and arrive Sunday afternoon. I depart Bangkok from BKK on Tuesday. My hotel offers an airport transfer from DMK. It offers fast track at BKK but not at DMK. Compare Grab, Klook, and the hotel transfer for my DMK arrival. Tell me whether a separate DMK arrival fast-track service is worth buying. Do not book anything."

- name: same-country-special-border-regime
  category: grounding
  tests: "Treats the request as an operational decision within an active trip. Normalizes the exact leg independently. Does not infer the immigration or customs process from shared sovereignty. Verifies the applicable border or customs regime with the responsible government authority. Verifies carrier handling and terminal process with the operating carrier or official airport. Uses only the minimum available eligibility inputs. Marks personalized eligibility unresolved when a required input is absent. Does not request or retain a passport number."
  persona: "A user who wants practical guidance for travel through a special border or customs regime."
  objective: "I am flying SAS from OSL to LYR as part of my trip. Both airports are in Norway. Can I treat this as an ordinary domestic flight with no passport or border checks? Verify the route-specific airport and entry process before advising me."

- name: trip-responsibility-checklist
  category: state
  tests: "Maintains one compact responsibility checklist and renders it in chat as a Markdown trip-status table with component, current plan, status, and next step. Records an outcome, owner, status, next action or decision, evidence state, and material deadline for every open item internally. Separates planning work supported by available tools, purchases owned by the booking skill or an applicable direct provider, and actions owned by the user. Keeps the user-reported flights locked without claiming supplier verification. Represents the shortlisted hotel, unresolved ryokan policy, and passport renewal as distinct states. Does not create an itinerary artifact during the active planning session, declare the trip complete while required work remains open, expose internal provider identifiers, convert an optional item into a requirement, or imply that a recommendation is booked."
  persona: "A user who wants a reliable operational view of a partially arranged trip."
  objective: "Help me finish my Japan trip. My flights are confirmed. The Tokyo hotel is only shortlisted. The Hakone ryokan's child policy is still being researched. I need to renew my passport before anything else can be ticketed. Show one compact list of what planning can investigate or prepare, what is ready for booking, and what remains my responsibility. Do not make any purchases."

- name: substantial-trip-offers-side-chat
  category: conversation
  tests: "Recognizes a substantial planning request in the Main chat and briefly offers a dedicated trip side chat for the itinerary, research, and revisions. When muse.create_options is available, uses it for that bounded choice instead of asking for a typed letter or phrase. Does not create the chat, start a long intake, search private connected sources, or pretend the work moved before the user accepts. It does not mistake the request for quick booking."
  persona: "A parent beginning a complex trip who has not yet chosen destinations, dates, or route."
  objective: "Help me plan a three-week summer trip in Europe for two adults and our children, ages 6 and 10. We may visit three or four countries and will need flights, trains, hotels, and activities."

- name: accepted-side-chat-handoff
  category: conversation
  tests: "Treats the explicit request as approval to move substantial planning. From Main, creates exactly one forked side chat with a short trip-specific name, then sends the returned chat a planning kickoff message; does not misuse chat.create's naming message as the delivered turn and does not poll for the side-chat reply. The handoff tells the new chat to inspect inherited and connected context before asking only material gaps. If supported, navigates to that exact chat after discovering the UI target and reports navigation accurately; otherwise simply identifies the created chat. Does not also start planning in Main."
  persona: "A traveler who wants a durable workspace for a complex trip."
  objective: "This will be a comprehensive two-week Japan trip for my family next spring. Move it into a dedicated side chat and start the planning there, using everything already in this conversation."

- name: planning-mines-connected-context
  category: personalization
  tests: "Keeps the substantial plan in the current chat because the user explicitly requests it. Without being prompted to inspect mail or calendar, runs narrow read-only searches of the connected mailbox and relevant calendar before asking preferences. Recognizes repeated user-attributed United Economy Plus aisle selections, Hyatt king-room stays, and Hertz midsize rentals as observed provisional defaults, while not exposing confirmation codes, unrelated mail, or treating those patterns as authority to choose or book. Summarizes what is known and asks only the smallest coherent set of remaining material questions."
  persona: "A frequent traveler who expects the assistant to learn carefully from connected accounts without overgeneralizing."
  objective: "Plan an eight-day Rome and Florence trip for me, October 9–16, 2027. Keep the planning in this chat. Start with what you already know and ask me only about the important gaps."
